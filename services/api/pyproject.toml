[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "api-service"
version = "0.1.0"
description = "HTTP API service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.0,<0.144",
    "uvicorn>=0.54.0,<0.55",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "hatchling==1.32.4",
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pip-tools==7.6.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
